<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FFR Field Log</title>
<meta name="theme-color" content="#0a6f8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FFR Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="config.js"></script>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one-column field tool, sticky top bar, bottom tab bar; SLA = green, non-SLA = amber/red stripe on each job */
:root{
  --bg:#eef2f3; --surface:#ffffff; --surface2:#f6f8f9; --line:#d5dde0;
  --fg:#15222b; --muted:#5a6b74; --accent:#0a6f8f; --accent-fg:#ffffff; --accent-soft:#dcedf3;
  --sla:#1f8a4c; --sla-soft:#dff3e6; --non:#c2410c; --non-soft:#fdeadd;
  --inst:#5b4bb7; --inst-soft:#e9e6f8; --maint:#6b7280; --maint-soft:#eceef1;
  --warn:#a16207;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171c; --surface:#17222a; --surface2:#1c2932; --line:#2b3b45;
  --fg:#e6eef1; --muted:#9aaeb8; --accent:#3fb0d4; --accent-fg:#06222c; --accent-soft:#163543;
  --sla:#4cc782; --sla-soft:#173a27; --non:#f08a4b; --non-soft:#3d2414;
  --inst:#a597f0; --inst-soft:#2a2550; --maint:#a5adba; --maint-soft:#262d36; --warn:#e3b341; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171c; --surface:#17222a; --surface2:#1c2932; --line:#2b3b45;
  --fg:#e6eef1; --muted:#9aaeb8; --accent:#3fb0d4; --accent-fg:#06222c; --accent-soft:#163543;
  --sla:#4cc782; --sla-soft:#173a27; --non:#f08a4b; --non-soft:#3d2414;
  --inst:#a597f0; --inst-soft:#2a2550; --maint:#a5adba; --maint-soft:#262d36; --warn:#e3b341; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);font-size:15px;line-height:1.45;margin:0;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:13px;flex:none}
.brand b{display:block;font-size:16px;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .spacer{flex:1}
h1{font-size:22px;margin:18px 0 4px;text-wrap:balance}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:600}
p.lead{color:var(--muted);margin:0 0 14px}
main{padding-block:4px 24px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 160px;min-width:0}
label.f{display:grid;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{
  width:100%;font:inherit;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 11px;min-height:44px}
textarea{min-height:84px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.chip:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--non);border-color:var(--non)}
.btn.small{min-height:34px;padding:0 12px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:560px){.seg{grid-template-columns:repeat(4,1fr)}}
.seg button{border:2px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:10px;padding:10px;text-align:left;display:grid;gap:2px;min-height:64px}
.seg button b{font-size:14px}
.seg button span{font-size:12px;color:var(--muted)}
.seg button[aria-pressed=true][data-v=sla]{border-color:var(--sla);background:var(--sla-soft)}
.seg button[aria-pressed=true][data-v=nonsla]{border-color:var(--non);background:var(--non-soft)}
.seg button[aria-pressed=true][data-v=install]{border-color:var(--inst);background:var(--inst-soft)}
.seg button[aria-pressed=true][data-v=maint]{border-color:var(--maint);background:var(--maint-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;user-select:none}
.chip input{accent-color:var(--non);margin:0}
.chip:has(input:checked){border-color:var(--non);background:var(--non-soft);color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.sla{background:var(--sla-soft);color:var(--sla)}
.pill.nonsla{background:var(--non-soft);color:var(--non)}
.pill.install{background:var(--inst-soft);color:var(--inst)}
.pill.maint{background:var(--maint-soft);color:var(--maint)}
.pill.draft{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.done{background:var(--accent-soft);color:var(--accent)}
.pill.ex{background:transparent;color:var(--warn);border:1px dashed var(--warn)}
.jobs{display:grid;gap:10px}
.job{display:grid;grid-template-columns:5px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;color:inherit;padding:0}
.job .stripe{background:var(--maint)}
.job[data-t=sla] .stripe{background:var(--sla)}
.job[data-t=nonsla] .stripe{background:var(--non)}
.job[data-t=install] .stripe{background:var(--inst)}
.job .body{padding:12px 14px;display:grid;gap:4px;min-width:0}
.job .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.job .no{font-family:var(--mono);font-size:13px;font-weight:600}
.job .client{font-weight:600;font-size:15px}
.job .meta{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.non b{color:var(--non)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar > input{flex:1 1 200px}
.toolbar > select{flex:0 1 170px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ph{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.ph .cap{font-size:11px;padding:5px 7px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1}
.addph{display:flex;gap:8px;flex-wrap:wrap}
.addph label{flex:1 1 140px}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sig{display:grid;gap:6px}
.sig canvas{width:100%;height:150px;background:var(--surface2);border:1px dashed var(--muted);border-radius:8px;touch-action:none;display:block}
.sig .hint{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.mat{display:grid;grid-template-columns:1fr 80px 40px;gap:6px;align-items:center}
.matrow{display:grid;grid-template-columns:1fr 72px 40px;gap:6px;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.matinfo{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.matinfo:empty{display:none}
.mattot{display:flex;justify-content:space-between;font-size:14px;font-variant-numeric:tabular-nums;padding-top:2px}
.mlist{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;align-items:end;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mrow .mname{grid-column:1/-1}
@media (min-width:600px){.mrow{grid-template-columns:1fr 100px 120px 40px}.mrow .mname{grid-column:auto}}
table.bill input,table.bill select{width:100%;font:inherit;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:6px}
.note{font-size:13px;color:var(--muted)}
.callout{border-left:4px solid var(--non);background:var(--non-soft);padding:10px 12px;border-radius:6px;font-size:13px}
.callout.info{border-color:var(--accent);background:var(--accent-soft)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1 1 150px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;color:var(--muted);padding:8px 2px 10px;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current=page]{color:var(--accent)}
nav.tabs button.new .plus{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;margin-top:-14px;box-shadow:0 4px 10px rgba(0,0,0,.18)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:12px;max-width:420px;width:100%;padding:18px;display:grid;gap:12px}
table.bill{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.bill th,table.bill td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.bill th{color:var(--muted);font-weight:600;font-size:12px}
table.bill td.n,table.bill th.n{text-align:right}
.tblwrap{overflow-x:auto}
.mono{font-family:var(--mono)}
table.bill .mono,table.bill td.n{white-space:nowrap}
.btn{text-align:center;padding-block:8px;line-height:1.25}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.seg button{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><div class="mark">FFR</div><div style="min-width:0"><b>FFR Field Log</b><small id="whoami">Technician not set</small></div></div>
  <div class="spacer"></div>
  <span id="netstate" class="pill draft">Saved on this device</span>
</div></header>

<main class="wrap" id="view"></main>

<nav class="tabs" aria-label="Main"><div class="in">
  <button data-go="jobs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Jobs</button>
  <button data-go="billing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Billing</button>
  <button data-go="new" class="new"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></span>New job</button>
  <button data-go="clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/></svg>Clients</button>
  <button data-go="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Me</button>
</div></nav>

<script src="app.js"></script>
</body>
</html>
